# Serverrendrede sider, sidekart og admin.
#
# HVORFOR DETTE ER EN EGEN FIL:
#
# certbot skriver TLS-blokka rett inn i /etc/nginx/sites-available/pokepuls.
# Derfor NEKTER oppsett-api.sh a kopiere repoets nginx-konfig over den --
# gjor den det, forsvinner sertifikatet og hele siden blir utilgjengelig pa
# https. Det skjedde ved forste deploy etter at TLS var satt opp.
#
# Konsekvensen var at nye location-blokker i repoets konfig aldri kom ut i
# drift. De sto der, ferdig skrevet, og gjorde ingenting; /robots.txt svarte
# med app-skallet fordi den falt gjennom til `location /`.
#
# Losningen er a ha alt som endrer seg i en snippet, og bare EN linje --
# include-linjen -- i filen certbot eier. Da kan oppsettet legge til nye
# ruter uten a rore TLS-konfigurasjonen.
#
# Installeres som /etc/nginx/snippets/pokepuls-sider.conf.

# ---------------------------------------------------------------------
# SIKKERHETSHEADERE
#
# De sto i deploy/nginx-pokepuls.conf fra for, og virket ikke EN eneste dag:
# certbot eier /etc/nginx/sites-available/pokepuls, saa oppsett-api.sh
# nekter aa kopiere repoets versjon over den. Malt mot produksjon 10. august
# 2026 svarte pokepuls.no uten en eneste av dem.
#
# Derfor staar de her, i snippeten som FAKTISK installeres ved hver deploy.
# Det er samme leksa som robots.txt og /p/ larte oss, og den er verdt aa
# skrive ned to ganger: en konfigurasjonsfil som ikke deployes, er en fil
# som ikke finnes.
#
# Merk nginx sin arveregel: `add_header` i en location ERSTATTER alle
# arvede headere, den legger ikke til. Derfor gjentas de i /admin nedenfor,
# som har sin egen X-Robots-Tag.

# HSTS. Siden er https-only med certbot-redirect fra for. `preload` er
# bevisst utelatt -- den er nesten umulig aa reversere, og gevinsten er
# marginal for et domene av denne storrelsen.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Ingen bruk for kamera, mikrofon eller posisjon. Aa si det hoyt koster
# ingenting og fjerner en hel klasse med misbruk hvis noe skulle bli
# injisert.
# ÉN ADRESSE, IKKE TO.
#
# Malt mot produksjon: bade https://pokepuls.no/ og https://www.pokepuls.no/
# svarte 200 med hele nettstedet. Ingen omdirigering. Google saa to
# komplette kopier og maatte gjette hvilken som gjaldt -- lenker, autoritet
# og kravlebudsjett delt paa to.
#
# Canonical-taggen peker riktig, men den er et HINT. En 301 er en regel.
#
# `if` i server-kontekst med `return` er det ene tilfellet der `if` er trygt
# i nginx -- det er `if` inne i en location, sammen med andre direktiver,
# som er beryktet.
if ($host = www.pokepuls.no) {
    return 301 https://pokepuls.no$request_uri;
}

# EKTE 404, IKKE FORSIDEN.
#
# `location /` i certbot-filen har `try_files $uri $uri/ /index.html` -- den
# klassiske enkeltsidefallbacken. Pokepuls trenger den ikke: forsiden er
# `location = /`, produktsidene er /p/, og resten er ekte filer.
#
# Konsekvensen var at HVER skrivefeil i en adresse svarte 200 med forsiden
# og en canonical-lenke til «/». Sokemotorer ser da uendelig mange
# duplikater av forsiden, og et menneske som folger en brukket lenke tror
# den kom fram.
#
# proxy_intercept_errors staar av (standard), saa API-ets egne 404-svar
# gaar urort gjennom -- dette gjelder bare filer.
error_page 404 /404.html;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# CSP.
#
#   img-src ... https:   produktbildene kommer fra ~20 ulike butikk-CDN-er
#                        (shopify, quickbutik, wordpress). Aa liste dem ville
#                        brutt hver gang en butikk bytter leverandor.
#   style-src 'unsafe-inline'  app.js setter noen style-attributter direkte.
#                        Verdt aa rydde senere; inline STIL er langt mindre
#                        farlig enn inline SKRIPT.
#   script-src 'self'    ingen unsafe-inline. Det innebygde skriptet i
#                        nytt-passord.html ble flyttet ut nettopp for dette.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# ---------------------------------------------------------------------
# HTML-SIDENE
#
# Malt mot produksjon: forsiden svarte UTEN en eneste header, mens /p/ og
# /robots.txt hadde X-Frame-Options og nosniff. Forklaringen er nginx sin
# arveregel: `location /` i certbot-filen har sine egne add_header (for
# cache-styring), og én add_header i en location slaar av ALLE arvede.
#
# Vi kan ikke redigere den filen -- certbot eier den. Men vi kan gaa foran
# den: `location = /` (eksakt) og en regex-location vinner begge over
# prefikset `location /`. Da settes headerne der de faktisk maa vaere: paa
# sidene som kjorer javascript og holder en innlogget sesjon.
#
# `root` arves fra server-blokka, saa try_files finner filene som for.

# FORSIDEN SERVERRENDRES NAA.
#
# Den var en statisk fil, og det forste Google saa var ordet «laster…».
# API-et injiserer produktlisten i det SAMME skallet (web/index.html), saa
# appen oppforer seg noyaktig som for -- den skriver over innholdet naar
# app.js har kjort.
#
# MEN: forsiden var ogsaa det ene som alltid virket, uansett hva som var
# galt med API-et eller databasen. Den avhengigheten kan vi ikke innfore
# uten et nett under. Feiler API-et, serverer vi filen som for.
#
# `= @forside_statisk` -- likhetstegnet er ikke pynt. Uten det beholdes
# feilstatusen (502) selv naar vi leverer en fungerende side, og bade
# nettlesere og soekemotorer tror forsiden er nede.
location = / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    proxy_pass http://pokepuls_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @forside_statisk;
}

location @forside_statisk {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files /index.html =404;
}

location ~* \.html$ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri =404;
}

# Produktsider for sokemotorer. MA ligge for `location /`, ellers svarer
# nginx med index.html og Googlebot ser et tomt app-skall.
location /p/ {
    limit_req zone=pokepuls_api burst=20 nodelay;
    proxy_pass http://pokepuls_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Serverrendrede oversiktssider. MAA ligge for `location /`, ellers svarer
# nginx med app-skallet og Googlebot ser en tom side -- samme felle som tok
# /robots.txt og /p/ i sin tid.
location = /butikker {
    proxy_pass http://pokepuls_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /kalender {
    proxy_pass http://pokepuls_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Sidekart og robots genereres fra databasen: sidekartet skal bare inneholde
# produkter som faktisk har tilbud, og det vet bare Postgres.
location = /sitemap.xml {
    proxy_pass http://pokepuls_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /robots.txt {
    proxy_pass http://pokepuls_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Admin skal aldri i en sokeindeks. Headeren settes her og ikke bare i
# HTML-en, sa den ogsa gjelder admin.js.
location ~ ^/admin {
    # MAA gjenta headerne over: én add_header her slaar av ALLE arvede.
    # Uten dette ville admin -- den ene siden det faktisk er verdt aa
    # angripe -- vaert den eneste uten CSP.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri /admin.html;
}
