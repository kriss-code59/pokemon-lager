# Serverrendrede sider, sidekart og admin.
#
# HVORFOR DETTE ER EN EGEN FIL:
#
# certbot skriver TLS-blokka rett inn i /etc/nginx/sites-available/pokepuls.
# Derfor NEKTER oppsett-api.sh a kopiere repoets nginx-konfig over den --
# gjor den det, forsvinner sertifikatet og hele siden blir utilgjengelig pa
# https. Det skjedde ved forste deploy etter at TLS var satt opp.
#
# Konsekvensen var at nye location-blokker i repoets konfig aldri kom ut i
# drift. De sto der, ferdig skrevet, og gjorde ingenting; /robots.txt svarte
# med app-skallet fordi den falt gjennom til `location /`.
#
# Losningen er a ha alt som endrer seg i en snippet, og bare EN linje --
# include-linjen -- i filen certbot eier. Da kan oppsettet legge til nye
# ruter uten a rore TLS-konfigurasjonen.
#
# Installeres som /etc/nginx/snippets/pokepuls-sider.conf.

# Produktsider for sokemotorer. MA ligge for `location /`, ellers svarer
# nginx med index.html og Googlebot ser et tomt app-skall.
location /p/ {
    limit_req zone=pokepuls_api burst=20 nodelay;
    proxy_pass http://pokepuls_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Sidekart og robots genereres fra databasen: sidekartet skal bare inneholde
# produkter som faktisk har tilbud, og det vet bare Postgres.
location = /sitemap.xml {
    proxy_pass http://pokepuls_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /robots.txt {
    proxy_pass http://pokepuls_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Admin skal aldri i en sokeindeks. Headeren settes her og ikke bare i
# HTML-en, sa den ogsa gjelder admin.js.
location ~ ^/admin {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri /admin.html;
}
