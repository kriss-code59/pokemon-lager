# nginx for pokepuls.no
#
# To jobber: servere et statisk skall pa noen fa kilobyte, og sende /api/
# videre til uvicorn. Alt tungt loft ligger i Postgres bak.
#
# Legges i /etc/nginx/sites-available/pokepuls og symlinkes til sites-enabled.
# certbot skriver inn TLS-blokka selv (deploy/oppsett-api.sh kjorer den).

upstream pokepuls_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

# Rate limit pa API-et. 20 req/s med burst 40 er rikelig for en ekte bruker
# og stopper en enkel skrape-av-skraperen-loop.
limit_req_zone $binary_remote_addr zone=pokepuls_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name pokepuls.no www.pokepuls.no;

    root /home/pokepuls/pokemon-lager/web;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Komprimering er den storste enkeltgevinsten pa mobil: snapshot-JSON
    # faller typisk fra ~300 KB til under 40 KB.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        limit_req zone=pokepuls_api burst=40 nodelay;
        proxy_pass http://pokepuls_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # API-et setter sine egne Cache-Control og ETag. Ikke overstyr dem.
    }

    # Produktsider, sidekart og admin. Egen fil fordi certbot eier denne
    # konfigen -- se deploy/nginx-sider.conf for hele forklaringen.
    include snippets/pokepuls-sider.conf;

    # Service worker og manifest ma aldri caches lenge, ellers sitter
    # brukeren fast i en gammel versjon av appen.
    location = /sw.js              { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html         { add_header Cache-Control "no-cache"; }

    location ~* \.(css|js|svg|png|webp|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
