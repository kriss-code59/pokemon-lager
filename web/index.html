<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Pokepuls – priser og lagerstatus på Pokémon-kort i Norge</title>
<meta name="description" content="Sammenlign priser og se hva som er på lager av forseglede Pokémon-produkter hos 33 norske butikker. Få push-varsel på telefonen når en vare kommer inn. Oppdateres hvert 20. minutt.">
<link rel="canonical" href="https://pokepuls.no/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pokepuls">
<meta property="og:title" content="Pokepuls – priser og lagerstatus på Pokémon-kort i Norge">
<meta property="og:description" content="Sammenlign priser hos 33 norske butikker og få varsel når en vare kommer på lager.">
<meta property="og:url" content="https://pokepuls.no/">
<meta property="og:locale" content="nb_NO">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Pokepuls","url":"https://pokepuls.no/","inLanguage":"nb-NO","description":"Priser og lagerstatus på forseglede Pokémon-produkter hos norske butikker.","potentialAction":{"@type":"SearchAction","target":"https://pokepuls.no/?sok={search_term_string}","query-input":"required name=search_term_string"}}</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ikon.svg">
<link rel="stylesheet" href="/style.css?v=11">
</head>
<body>

<header class="topp">
  <div class="topp-rad">
    <h1 class="merke"><span class="merke-poke">poke</span><span class="merke-puls">puls</span></h1>
    <div class="topp-hoyre">
      <button class="puls" id="ferskhet" type="button" aria-live="polite">
        <span class="prikk" id="prikk"></span><span id="ferskhet-tekst">laster…</span>
      </button>
      <button class="konto-knapp" id="konto-knapp" type="button" aria-label="Konto">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-4 3.9-6 7.5-6s6.7 2 7.5 6"/></svg>
      </button>
    </div>
  </div>
  <div class="sok-rad">
    <input id="sok" type="search" inputmode="search" autocomplete="off"
           placeholder="Søk etter sett, produkt eller butikk" aria-label="Søk">
    <button id="tom-sok" class="tom-sok" type="button" aria-label="Tøm søket" hidden>&times;</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filtre">
    <button class="chip chip-av" data-filter="lager">Kun på lager</button>
    <button class="chip" data-filter="region" data-verdi="en">Engelsk</button>
    <button class="chip" data-filter="region" data-verdi="jp">Japansk</button>
    <button class="chip" data-filter="region" data-verdi="cn">Kinesisk</button>
    <button class="chip" data-filter="region" data-verdi="ko">Koreansk</button>
    <button class="chip" data-filter="type" data-verdi="booster-box">Booster Box</button>
    <button class="chip" data-filter="type" data-verdi="etb">ETB</button>
    <button class="chip" data-filter="type" data-verdi="bundle">Bundle</button>
    <button class="chip" data-filter="type" data-verdi="tin">Tin</button>
  </div>
</header>

<main id="innhold">
  <section id="fane-produkter" class="fane">
    <p class="teller" id="teller"></p>
    <div id="liste" class="liste"></div>
    <p class="tom" id="tom-liste" hidden>Ingen treff. Prøv et annet søk, eller slå av filtrene.</p>
  </section>

  <section id="fane-nytt" class="fane" hidden>
    <div class="chips chips-under" id="hendelse-chips" role="group" aria-label="Hendelsestyper">
      <button class="chip chip-av" data-kind="restock">Restock</button>
      <button class="chip" data-kind="ny">Nye</button>
      <button class="chip" data-kind="prisendring">Prisendring</button>
      <button class="chip" data-kind="utsolgt">Utsolgt</button>
    </div>
    <div id="hendelser" class="liste"></div>
  </section>

  <section id="fane-folger" class="fane" hidden>
    <div id="folger-innhold"></div>
  </section>

  <section id="fane-andre" class="fane" hidden>
    <p class="hjelp">Forseglede varer som ennå ikke er koblet til et kanonisk
      produkt. De vises her så ingenting blir usynlig mens katalogen fylles ut.</p>
    <div id="andre" class="liste"></div>
    <button class="mer" id="mer-andre" type="button" hidden>Vis flere</button>
  </section>
</main>

<nav class="faner" role="tablist">
  <button class="fane-knapp valgt" data-fane="produkter" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Produkter</button>
  <button class="fane-knapp" data-fane="nytt" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 4 14h7l-1 7 9-11h-7z"/></svg>Nytt</button>
  <button class="fane-knapp" data-fane="folger" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.4A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.6c0 5-7 9.4-7 9.4z"/></svg>Følger</button>
  <button class="fane-knapp" data-fane="andre" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v13H3zM8 7V4h8v3"/></svg>Andre</button>
</nav>

<div class="ark-bakgrunn" id="ark-bakgrunn" hidden></div>
<div class="ark" id="ark" role="dialog" aria-modal="true" hidden>
  <div class="ark-hank"></div>
  <button class="ark-lukk" id="ark-lukk" type="button" aria-label="Lukk">&times;</button>
  <div id="ark-innhold"></div>
</div>

<script src="/app.js?v=11" type="module"></script>
</body>
</html>
