<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Pokepuls — Pokémon-lager i Norge</title>
<meta name="description" content="Ser lagerstatus og pris pa forseglede Pokemon-produkter hos 33 norske butikker. Oppdateres hvert 20. minutt.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/ikon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ikon-180.png">
<link rel="stylesheet" href="/style.css?v=1">
</head>
<body>

<header class="topp">
  <div class="topp-rad">
    <h1 class="merke"><span class="merke-poke">poke</span><span class="merke-puls">puls</span></h1>
    <button class="puls" id="ferskhet" type="button" aria-live="polite">
      <span class="prikk" id="prikk"></span><span id="ferskhet-tekst">laster…</span>
    </button>
  </div>
  <div class="sok-rad">
    <input id="sok" type="search" inputmode="search" autocomplete="off"
           placeholder="Sok etter sett, produkt eller butikk" aria-label="Sok">
    <button id="tom-sok" class="tom-sok" type="button" aria-label="Tom soket" hidden>&times;</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filtre">
    <button class="chip chip-av" data-filter="lager">Kun pa lager</button>
    <button class="chip" data-filter="region" data-verdi="en">Vestlig</button>
    <button class="chip" data-filter="region" data-verdi="jp">Japansk</button>
    <button class="chip" data-filter="region" data-verdi="cn">Kinesisk</button>
    <button class="chip" data-filter="region" data-verdi="ko">Koreansk</button>
    <button class="chip" data-filter="type" data-verdi="booster-box">Booster Box</button>
    <button class="chip" data-filter="type" data-verdi="etb">ETB</button>
    <button class="chip" data-filter="type" data-verdi="bundle">Bundle</button>
    <button class="chip" data-filter="type" data-verdi="tin">Tin</button>
  </div>
</header>

<main id="innhold">
  <section id="fane-produkter" class="fane">
    <p class="teller" id="teller"></p>
    <div id="liste" class="liste"></div>
    <p class="tom" id="tom-liste" hidden>Ingen treff. Prov et annet sok, eller sla av filtrene.</p>
  </section>

  <section id="fane-nytt" class="fane" hidden>
    <div class="chips chips-under" id="hendelse-chips" role="group" aria-label="Hendelsestyper">
      <button class="chip chip-av" data-kind="restock">Restock</button>
      <button class="chip" data-kind="ny">Nye</button>
      <button class="chip" data-kind="prisendring">Prisendring</button>
      <button class="chip" data-kind="utsolgt">Utsolgt</button>
    </div>
    <div id="hendelser" class="liste"></div>
  </section>

  <section id="fane-andre" class="fane" hidden>
    <p class="hjelp">Forseglede varer som enna ikke er koblet til et kanonisk
      produkt. De vises her sa ingenting blir usynlig mens katalogen fylles ut.</p>
    <div id="andre" class="liste"></div>
    <button class="mer" id="mer-andre" type="button" hidden>Vis flere</button>
  </section>
</main>

<nav class="faner" role="tablist">
  <button class="fane-knapp valgt" data-fane="produkter" role="tab" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Produkter</button>
  <button class="fane-knapp" data-fane="nytt" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 4 14h7l-1 7 9-11h-7z"/></svg>Nytt</button>
  <button class="fane-knapp" data-fane="andre" role="tab" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v13H3zM8 7V4h8v3"/></svg>Andre varer</button>
</nav>

<div class="ark-bakgrunn" id="ark-bakgrunn" hidden></div>
<div class="ark" id="ark" role="dialog" aria-modal="true" aria-labelledby="ark-tittel" hidden>
  <div class="ark-hank"></div>
  <button class="ark-lukk" id="ark-lukk" type="button" aria-label="Lukk">&times;</button>
  <div id="ark-innhold"></div>
</div>

<script src="/app.js?v=1" type="module"></script>
</body>
</html>
