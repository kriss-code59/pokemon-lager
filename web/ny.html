<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<!-- FORHANDSVISNING. Skal aldri i et sokeresultat: den viser samme varer som
     forsiden, og to sider med samme innhold konkurrerer med hverandre. -->
<meta name="robots" content="noindex, nofollow">
<title>Pokepuls – forhåndsvisning av nytt design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/ny.css?v=1">
</head>
<body>

<div class="proveband">
  Forhåndsvisning av nytt design · ekte data · <a href="/">tilbake til dagens side</a>
</div>

<header class="topp">
  <div class="topp-rad">
    <div class="merke">pokepuls<span class="puls" aria-hidden="true"></span></div>
    <div class="topp-knapper">
      <button class="ikonknapp" id="knapp-sok" type="button" aria-label="Søk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="ikonknapp" id="knapp-folger" type="button" aria-label="Følger">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a5.5 5.5 0 0 0-5.5 5.5c0 4.5-2 6-2 6h15s-2-1.5-2-6A5.5 5.5 0 0 0 12 3.5z"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></svg>
        <span class="teller-merke" id="folger-teller" hidden>0</span>
      </button>
    </div>
  </div>
  <p class="friskhet" id="friskhet">laster…</p>
  <div class="sok-rad" id="sok-rad" hidden>
    <input id="sok" type="search" inputmode="search" autocomplete="off"
           placeholder="Søk etter sett, produkt eller butikk" aria-label="Søk">
  </div>
</header>

<!-- Det eneste som haster paa hele siden. Er ingenting nytt inne, kollapser
     den til én stille linje i stedet for en tom mork blokk. -->
<section class="stripe" id="stripe" hidden></section>

<div class="filterrad">
  <button class="filterknapp" id="knapp-filtre" type="button">
    Filtre<span class="filterteller" id="filterteller" hidden>0</span>
  </button>
  <div class="aktive-filtre" id="aktive-filtre"></div>
  <button class="sortknapp" id="knapp-sort" type="button">Nytt <span aria-hidden="true">⌄</span></button>
</div>

<div class="filterpanel" id="filterpanel" hidden>
  <div class="filtergruppe">
    <p class="etikett">Status</p>
    <div class="valg" id="valg-status"></div>
  </div>
  <div class="filtergruppe">
    <p class="etikett">Språk</p>
    <div class="valg" id="valg-sprak"></div>
  </div>
  <div class="filtergruppe">
    <p class="etikett">Type</p>
    <div class="valg" id="valg-type"></div>
  </div>
  <div class="filtergruppe">
    <p class="etikett">Tetthet</p>
    <div class="valg" id="valg-tetthet"></div>
  </div>
</div>

<main id="innhold">
  <p class="resultat" id="resultat"></p>
  <div id="liste" class="liste luftig"></div>
  <p class="tom" id="tom" hidden></p>
</main>

<nav class="faner" aria-label="Seksjoner">
  <button class="fane valgt" type="button" data-fane="produkter">
    <span class="glyf" aria-hidden="true"></span><span>Produkter</span>
  </button>
  <a class="fane" href="/kalender"><span class="glyf" aria-hidden="true"></span><span>Kalender</span></a>
  <button class="fane" type="button" data-fane="folger">
    <span class="glyf" aria-hidden="true"></span><span>Følger</span>
  </button>
  <a class="fane" href="/statistikk.html"><span class="glyf" aria-hidden="true"></span><span>Statistikk</span></a>
</nav>

<div class="ark-bak" id="ark-bak" hidden></div>
<section class="ark" id="ark" hidden aria-live="polite"></section>

<script src="/ny.js?v=1"></script>
</body></html>
